<script>
// Turn on multi-threading for the converter: register coi-sw.js, then reload once so it takes effect.
(function () {
  if (self.crossOriginIsolated || !('serviceWorker' in navigator) || !window.isSecureContext) return;
  navigator.serviceWorker.register('coi-sw.js').then(function () {
    if (navigator.serviceWorker.controller) return;
    navigator.serviceWorker.ready.then(function () {
      try { if (sessionStorage.getItem('coi-reloaded')) return; sessionStorage.setItem('coi-reloaded', '1'); } catch (e) { return; }
      location.reload();
    });
  }).catch(function () {});
})();

<script id="tx-src">
// Piano audio -> notes. Onset-difference multi-pitch estimation:
// 1) find onsets with a SuperFlux-style spectral flux (2048 window, 10 ms hop),
// 2) at each onset take the spectrum just after minus the spectrum just before, so only the
//    newly struck notes remain, then pick pitches by harmonic summation with iterative cancellation,
// 3) follow each note's harmonic energy forward to find where it dies away.
(function (root) {
'use strict';

const DEFAULTS = {
  sr: 22050,
  onsetN: 2048, onsetHop: 220, onsetLag: 2, onsetDelta: 0.1, onsetWait: 0.035,
  pitchN: 4096, pitchHop: 441, preOff: 0.10, postOff: 0.10,
  maxFreq: 5500, maxHarm: 12, inharm: 1e-4, tol: 0.025,
  compress: 1, maxPoly: 8, relThr: 0.18, absThr: 0.05,
  fundMinP: 45, fundRatio: 0.3, cancelSmooth: 1, cancelW: 2,
  method: 1, nmfIter: 60, nmfFixedIter: 10, nmfSparse: 0.1, nmfPow: 1, nmfAbs: 0.08, nmfRel: 0.25, octRatio: 1,
  restrike: 0, restrikeMinP: 36, restrikeWindow: 2, restrikeRatio: 1.3, restrikeAbs: 0.3,
  endRatio: 0.18, maxLen: 8, minLen: 0.06,
  lo: 21, hi: 108,
};

function makeFFT(n) {
  const cos = new Float64Array(n / 2), sin = new Float64Array(n / 2), rev = new Uint32Array(n);
  for (let i = 0; i < n / 2; i++) { cos[i] = Math.cos(2 * Math.PI * i / n); sin[i] = Math.sin(2 * Math.PI * i / n); }
  const bits = Math.round(Math.log2(n));
  for (let i = 0; i < n; i++) { let r = 0; for (let b = 0; b < bits; b++) r |= ((i >> b) & 1) << (bits - 1 - b); rev[i] = r; }
  return function fft(re, im) {
    for (let i = 0; i < n; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1, step = n / size;
      for (let i = 0; i < n; i += size) {
        for (let j = i, k = 0; j < i + half; j++, k += step) {
          const l = j + half, c = cos[k], s = sin[k];
          const tr = re[l] * c + im[l] * s, ti = im[l] * c - re[l] * s;
          re[l] = re[j] - tr; im[l] = im[j] - ti; re[j] += tr; im[j] += ti;
        }
      }
    }
  };
}

// Magnitude STFT of centred frames, two real frames per complex FFT. Calls sink(frameIndex, mag).
function stft(x, N, hop, nBins, sink) {
  const fft = makeFFT(N), win = new Float64Array(N);
  for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
  const nFrames = Math.floor(x.length / hop) + 1;
  const re = new Float64Array(N), im = new Float64Array(N);
  const ma = new Float32Array(nBins), mb = new Float32Array(nBins);
  const scale = 2 / N;
  for (let f = 0; f < nFrames; f += 2) {
    const s0 = f * hop - N / 2, s1 = s0 + hop;
    for (let i = 0; i < N; i++) {
      const ia = s0 + i, ib = s1 + i;
      re[i] = ia >= 0 && ia < x.length ? x[ia] * win[i] : 0;
      im[i] = ib >= 0 && ib < x.length ? x[ib] * win[i] : 0;
    }
    fft(re, im);
    for (let k = 0; k < nBins; k++) {
      const j = k === 0 ? 0 : N - k;
      const ar = (re[k] + re[j]) / 2, ai = (im[k] - im[j]) / 2;
      const br = (im[k] + im[j]) / 2, bi = (re[j] - re[k]) / 2;
      ma[k] = Math.hypot(ar, ai) * scale; mb[k] = Math.hypot(br, bi) * scale;
    }
    sink(f, ma);
    if (f + 1 < nFrames) sink(f + 1, mb);
  }
  return nFrames;
}

function detectOnsets(x, o) {
  const N = o.onsetN, hop = o.onsetHop, binHz = o.sr / N;
  const k0 = Math.max(1, Math.floor(30 / binHz)), k1 = Math.min(N / 2, Math.ceil(o.maxFreq / binHz));
  const nb = k1 + 2;
  const hist = []; const odf = [];
  stft(x, N, hop, nb, (f, mag) => {
    const lm = new Float32Array(nb);
    for (let k = 0; k < nb; k++) lm[k] = Math.log1p(100 * mag[k]);
    let v = 0;
    const prev = hist.length >= o.onsetLag ? hist[hist.length - o.onsetLag] : null;
    if (prev) for (let k = k0; k <= k1; k++) { const m = Math.max(prev[k - 1], prev[k], prev[k + 1]); const d = lm[k] - m; if (d > 0) v += d; }
    odf.push(v);
    hist.push(lm); if (hist.length > o.onsetLag) hist.shift();
  });
  // normalise, then adaptive-threshold peak picking
  const n = odf.length;
  const sorted = Float32Array.from(odf).sort();
  const ref = sorted[Math.floor(n * 0.98)] || 1;
  for (let i = 0; i < n; i++) odf[i] /= ref;
  const onsets = [];
  const wait = Math.round(o.onsetWait * o.sr / hop);
  let last = -1e9;
  for (let i = 3; i < n - 3; i++) {
    const v = odf[i];
    let isMax = true;
    for (let j = i - 3; j <= i + 3; j++) if (odf[j] > v) { isMax = false; break; }
    if (!isMax) continue;
    let mean = 0, c = 0;
    for (let j = Math.max(0, i - 10); j <= Math.min(n - 1, i + 7); j++) { mean += odf[j]; c++; }
    mean /= c;
    if (v < mean + o.onsetDelta * 0.5 || v < o.onsetDelta) continue;
    if (i - last < wait) continue;
    onsets.push({ t: i * hop / o.sr, strength: v });
    last = i;
  }
  return onsets;
}

function buildTemplates(o, binHz, nb) {
  const T = [];
  for (let p = o.lo; p <= o.hi; p++) {
    const f0 = 440 * Math.pow(2, (p - 69) / 12);
    const parts = [];
    for (let m = 1; m <= o.maxHarm; m++) {
      const fm = m * f0 * Math.sqrt(1 + o.inharm * m * m);
      if (fm > o.maxFreq) break;
      const c = fm / binHz, w = Math.max(1, c * o.tol);
      const a = Math.max(1, Math.floor(c - w)), b = Math.min(nb - 1, Math.ceil(c + w));
      if (a > b) break;
      parts.push({ a, b, g: (f0 + 27) / (m * f0 + 320) });
    }
    T.push({ p, parts });
  }
  return T;
}

function salience(Y, t) {
  let s = 0;
  for (const pt of t.parts) { let mx = 0; for (let k = pt.a; k <= pt.b; k++) if (Y[k] > mx) mx = Y[k]; s += pt.g * mx; }
  return s;
}

function estimatePitches(Y, T, o, ref) {
  const out = [];
  const R = Float32Array.from(Y);
  const taken = new Set();
  let first = 0;
  const peakIn = (pt) => { let mx = 0; for (let k = pt.a; k <= pt.b; k++) if (R[k] > mx) mx = R[k]; return mx; };
  for (let it = 0; it < o.maxPoly; it++) {
    let best = -1, bs = 0;
    for (let i = 0; i < T.length; i++) {
      if (taken.has(i)) continue;
      const t = T[i];
      const s = salience(R, t);
      if (s <= bs) continue;
      // A real note above the bass has its fundamental present; octave-below ghosts don't.
      if (t.p >= o.fundMinP && t.parts.length > 1) {
        let amax = 0; for (let m = 0; m < Math.min(4, t.parts.length); m++) amax = Math.max(amax, peakIn(t.parts[m]));
        if (peakIn(t.parts[0]) < o.fundRatio * amax) continue;
      }
      bs = s; best = i;
    }
    if (best < 0) break;
    if (it === 0) first = bs;
    if (bs < o.relThr * first || bs < o.absThr * ref) break;
    taken.add(best);
    out.push({ pitch: T[best].p, sal: bs });
    // cancel this note's partials (spectrally smoothed amplitudes)
    const parts = T[best].parts, amps = [], peaks = [];
    for (const pt of parts) { let mx = 0, km = pt.a; for (let k = pt.a; k <= pt.b; k++) if (R[k] > mx) { mx = R[k]; km = k; } amps.push(mx); peaks.push(km); }

      const d = e.data;

  setAudio(buf, file.name, `Converted ${notes.length} notes. You're hearing the original recording; tick Synth to hear the MIDI.`);
}

// .mid isn't on the viewer's download list, so inside claude.ai the file goes out in a .zip.
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function zipOne(name, data) {
  let crc = 0xFFFFFFFF; for (let i = 0; i < data.length; i++) crc = CRC_TABLE[(crc ^ data[i]) & 255] ^ (crc >>> 8); crc = (crc ^ 0xFFFFFFFF) >>> 0;
  const nm = new TextEncoder().encode(name), size = data.length;
  const out = new Uint8Array(30 + nm.length + size + 46 + nm.length + 22), dv = new DataView(out.buffer);
  let p = 0;
  const u32 = (v) => { dv.setUint32(p, v, true); p += 4; }, u16 = (v) => { dv.setUint16(p, v, true); p += 2; };
  u32(0x04034b50); u16(20); u16(0); u16(0); u16(0); u16(0x21); u32(crc); u32(size); u32(size); u16(nm.length); u16(0);
  out.set(nm, p); p += nm.length; out.set(data, p); p += size;
  const cd = p;
  u32(0x02014b50); u16(20); u16(20); u16(0); u16(0); u16(0); u16(0x21); u32(crc); u32(size); u32(size); u16(nm.length); u16(0); u16(0); u16(0); u16(0); u32(0); u32(0);
  out.set(nm, p); p += nm.length;
  const cdSize = p - cd;
  u32(0x06054b50); u16(0); u16(0); u16(1); u16(1); u32(cdSize); u32(cd); u16(0);
  return out;
}
async function saveMidi() {
  if (!lastMidi) return;
  if (window.claude && typeof window.claude.use === 'function') {
    const dl = await window.claude.use('downloads');
    if (dl) {
      const zipName = lastMidi.name.replace(/\.mid$/i, '') + '.zip';
      try { await dl.save({ filename: zipName, data: zipOne(lastMidi.name, lastMidi.bytes) }); toast('Saved ' + zipName + '. Unzip it to get ' + lastMidi.name + '.', 6000); }
      catch (e) { if (!e || e.code !== 'declined') toast('Could not save the file here (' + ((e && e.code) || 'error') + ').', 6000); }
      return;
    }
  }
  const url = URL.createObjectURL(new Blob([lastMidi.bytes], { type: 'audio/midi' }));
  const a = document.createElement('a'); a.href = url; a.download = lastMidi.name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function handleFiles(files) {
  for (const f of files) {
    if (/\.(mid|midi|kar|rmi)$/i.test(f.name) || /midi/.test(f.type)) f.arrayBuffer().then((b) => loadMidi(b, f.name));
    else if (/^audio\//.test(f.type) || /\.(wav|mp3|flac|ogg|m4a|aac|opus)$/i.test(f.name)) loadAudioFile(f);
    else toast(f.name + ' is not a MIDI or audio file.');
  }
}

// controls
playBtn.addEventListener('click', () => clock.playing ? pause() : play());
let seeking = false;
seekEl.addEventListener('input', () => { seeking = true; seek(parseFloat(seekEl.value)); });
seekEl.addEventListener('change', () => { seeking = false; });
function setDir(d) {
  S.dir = d; $('dirH').setAttribute('aria-pressed', d === 'h'); $('dirV').setAttribute('aria-pressed', d === 'v');
  computeGeo(); savePrefs();
}
$('dirH').addEventListener('click', () => setDir('h'));
$('dirV').addEventListener('click', () => setDir('v'));
$('speed').addEventListener('change', (e) => { const t = now(); S.rate = parseFloat(e.target.value); if (clock.playing) { clock.t = t; stopVoices(); startEngines(t); } });
$('zoom').addEventListener('input', (e) => { S.pps = parseFloat(e.target.value); savePrefs(); });
$('synth').addEventListener('change', (e) => { S.synth = e.target.checked; if (!S.synth) stopVoices(); else { ensureCtx(); ptr = lowerBound(now()); } savePrefs(); });
$('vol').addEventListener('input', (e) => { S.volume = parseFloat(e.target.value); if (synthBus) synthBus.gain.value = S.volume * 0.6; savePrefs(); });
$('shift').addEventListener('change', (e) => { S.shift = parseFloat(e.target.value) || 0; updateDuration(); restartIfPlaying(); });
$('labels').addEventListener('change', (e) => { S.labels = e.target.checked; savePrefs(); });
$('colorBy').addEventListener('change', (e) => { S.colorBy = e.target.value; colorNotes(); savePrefs(); });
$('openMidi').addEventListener('click', () => $('midiFile').click());
$('openAudio').addEventListener('click', () => $('audioFile').click());
$('midiFile').addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });
$('audioFile').addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });
$('convert').addEventListener('click', () => $('convertFile').click());
$('convertFile').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) convertFile(f); });
$('saveMidi').addEventListener('click', saveMidi);
$('audioRemove').addEventListener('click', () => {
  if (clock.playing) pause();
  audioBuf = null; $('audioChip').hidden = true; $('shiftField').hidden = true; updateDuration(); clock.t = Math.min(clock.t, S.duration);
});

// drag & drop
let dragDepth = 0;
addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; $('drop').hidden = false; e.preventDefault(); } });
addEventListener('dragover', (e) => { e.preventDefault(); });
addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('drop').hidden = true; });
addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

// scrubbing on the roll
let drag = null, keyDrag = false;
const local = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  const p = keyAt(...local(e));
  if (p !== null) { keyDrag = true; pressKey(p); return; }
  drag = { x: e.clientX, y: e.clientY, t: now(), moved: false, wasPlaying: clock.playing };
});
canvas.addEventListener('pointermove', (e) => {
  if (keyDrag) { const p = keyAt(...local(e)); if (p === null) releaseKey(); else pressKey(p); return; }
  if (!drag) { canvas.style.cursor = keyAt(...local(e)) !== null ? 'pointer' : ''; return; }
  const d = S.dir === 'v' ? (e.clientY - drag.y) : -(e.clientX - drag.x);
  if (!drag.moved && Math.abs(d) < 5) return;
  if (!drag.moved) { drag.moved = true; canvas.classList.add('dragging'); if (clock.playing) pause(); }
  seek(drag.t + d / S.pps);
});
const endDrag = () => {
  if (keyDrag) { keyDrag = false; releaseKey(); return; }
  if (!drag) return;
  canvas.classList.remove('dragging');
  if (!drag.moved) { clock.playing ? pause() : play(); }
  else if (drag.wasPlaying) play();
  drag = null;
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', () => { if (keyDrag) { keyDrag = false; releaseKey(); } if (drag) { canvas.classList.remove('dragging'); drag = null; } });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) { S.pps = clamp(S.pps * Math.exp(-e.deltaY * 0.002), 40, 600); $('zoom').value = S.pps; savePrefs(); }
  else seek(now() + (e.deltaY + e.deltaX) / S.pps);
}, { passive: false });

addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  if (e.code === 'Space') {
    if (tag === 'BUTTON' || tag === 'SELECT' || (tag === 'INPUT' && e.target.type !== 'range') || tag === 'SUMMARY') return;
    e.preventDefault(); clock.playing ? pause() : play();
  } else if (tag === 'INPUT' || tag === 'SELECT') return;
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(now() - 5); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seek(now() + 5); }
  else if (e.key === 'Home') { seek(0); }
  else if (e.key === '+' || e.key === '=') { S.pps = clamp(S.pps * 1.2, 40, 600); $('zoom').value = S.pps; }
  else if (e.key === '-') { S.pps = clamp(S.pps / 1.2, 40, 600); $('zoom').value = S.pps; }
  else if (e.key === 'd' || e.key === 'D') setDir(S.dir === 'h' ? 'v' : 'h');
});
document.addEventListener('click', (e) => { const m = $('tracksMenu'); if (m.open && !m.contains(e.target)) m.open = false; });

// ---------- main loop ----------
let lastLabel = '';
function frame() {
  if (clock.playing) {
    const t = now();
    if (t >= S.duration) { pause(); clock.t = S.duration; }
    else { clock.t = t; schedule(t); }
  }
  draw(clock.t);
  const lbl = fmt(clock.t);
  if (lbl !== lastLabel) { timeEl.textContent = lbl; lastLabel = lbl; }
  if (!seeking) seekEl.value = clock.t;
  requestAnimationFrame(frame);
}

// boot
$('zoom').value = S.pps; $('labels').checked = S.labels; $('synth').checked = S.synth; $('vol').value = S.volume; $('colorBy').value = S.colorBy;
setDir(S.dir === 'v' ? 'v' : 'h');
setPlayIcon();
readTheme();
resize();
try {
  const bin = atob(SAMPLE_B64); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  loadMidi(u.buffer, SAMPLE_NAME);
} catch (e) { updateDuration(); }
requestAnimationFrame(frame);
})();
</script>
